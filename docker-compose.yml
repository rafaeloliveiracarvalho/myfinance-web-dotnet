services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      SA_PASSWORD: "Teste123@"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - myfinance_network

  myfinance-web:
    build:
      context: .
      dockerfile: ./application/Dockerfile
      target: build
    image: myfinance-web
    container_name: myfinance-web
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=myfinancedb;User Id=sa;Password=Teste123@;TrustServerCertificate=True;Encrypt=False;"
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
    volumes:
      - ./application:/src/application
      - ./domain:/src/domain
      - ./infra:/src/infra
      - ./service:/src/service
      - ./myfinance-web-dotnet.sln:/src/myfinance-web-dotnet.sln
    entrypoint: dotnet watch run --non-interactive --project "/src/application/application.csproj" --urls "http://0.0.0.0:8080"
    depends_on:
      - sqlserver
    networks:
      - myfinance_network

volumes:
  sqlserver_data:

networks:
  myfinance_network:
    driver: bridge
